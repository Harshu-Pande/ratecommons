[package]
name = "ticcore"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "RateCommons core: streaming splitter, parser and hasher for Transparency in Coverage files"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crossbeam-channel = "0.5"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
