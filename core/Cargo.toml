[package]
name = "ticcore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "RateCommons core: streaming splitter, parser and hasher for Transparency in Coverage files"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision", "preserve_order"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"
arrow-array = "55"
arrow-schema = "55"
parquet = { version = "55", default-features = false, features = ["arrow", "zstd"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
