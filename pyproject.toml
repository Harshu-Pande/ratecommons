[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticdata"
version = "0.0.2"
description = "Crawler and parser for an open, deduplicated Transparency in Coverage dataset"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "requests>=2.32",
  "huggingface_hub==2.2.0",
  "rapidgzip==0.16.0",
  "pyarrow>=21",
  "xxhash>=3.5",
  "ijson>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ticdata = "ticdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
