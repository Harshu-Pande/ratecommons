name: cloud
# Cloud pack: serving packs re-cut into small files per billing code and per state (src/ticdata/cloudpack.py),
# uploaded to the public work bucket under serve/v1/ for the serverless app (cloud/).
# Trigger: edit ops/cloud-request.txt; its last line lists targets, e.g. "shared cigna aetna uhc".
on:
  workflow_dispatch:
    inputs:
      request: { description: "targets", required: true, default: "shared cigna aetna uhc" }
  push:
    branches: [main]
    paths: ["ops/cloud-request.txt"]

permissions:
  contents: read
  id-token: write

run-name: "cloud ${{ github.event.inputs.request || github.event.head_commit.message }}"

jobs:
  args:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.a.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: a
        run: |
          line="${{ github.event.inputs.request }}"
          [ -n "$line" ] || line="$(grep -v '^#' ops/cloud-request.txt | grep -v '^[[:space:]]*$' | tail -1)"
          t=""; for x in $line; do t="$t,\"$x\""; done
          echo "targets=[${t#,}]" >> "$GITHUB_OUTPUT"

  build:
    needs: args
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.args.outputs.targets) }}
    env:
      PYTHONUNBUFFERED: "1"
      RC_DUCK_MEMORY: "11GB"
      RC_DUCK_THREADS: "4"
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: build ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = shared ]; then ticdata cloud-shared; else ticdata cloud-pack --payer "${{ matrix.target }}"; fi
      - if: always()
        run: df -h / | tail -1
