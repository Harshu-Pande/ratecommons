name: orchestrate
# Starts the next map and reduce runs from ops/waves.txt. Who calls it: each successful reduce and every map run (their
# `next` jobs), a failed reduce run (its `after-failure` job dispatches this with after_run, so the failed jobs are
# re-run once that run has ended), and a cron backstop. GitHub's schedule fires only every 5-8 h here, and
# workflow_run never fires for runs our own token started, so neither can be relied on.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_run:  # fires only for runs a person started (pushes)
    workflows: [map, reduce]
    types: [completed]
  workflow_dispatch:
    inputs:
      after_run: { description: "wait until this run has ended first (a failed reduce dispatching its re-run)", required: false, default: "" }

permissions:
  contents: read
  actions: write   # dispatch reduce, map, serve, cloud and shop runs
  id-token: write  # delete finished waves' map output from the work bucket

concurrency:
  group: orchestrate
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: wait for the run that asked for this pass to end
        if: github.event.inputs.after_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ github.event.inputs.after_run }}
        run: for i in $(seq 40); do [ "$(gh api repos/${{ github.repository }}/actions/runs/$AFTER --jq .status)" = completed ] && break; sleep 15; done
      - run: python ops/orchestrate.py
        env:
          GH_TOKEN: ${{ github.token }}
