name: orchestrate
# Every 15 minutes: start the next reduce wave from ops/waves.txt once its shards are mapped. (GitHub drops scheduled
# runs under load: at 30 minutes it fired 02:13 then not again for 5 h on 2026-11-04 while a failed reduce waited.)
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # dispatch reduce, map, serve, cloud and shop runs
  id-token: write  # delete finished waves' map output from the work bucket

concurrency:
  group: orchestrate
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - run: python ops/orchestrate.py
        env:
          GH_TOKEN: ${{ github.token }}
