name: smoke
# Proves GitHub's runners can reach the payers, write to Hugging Face, and how fast they work.
# Kaggle was measured separately on 2026-10-21 (see docs/DECISIONS.md).
# Trigger: Actions tab -> smoke -> Run workflow, or edit ops/smoke-request.txt.
on:
  workflow_dispatch:
    inputs:
      uhc_gb:
        description: "GB of UHC JSON to decompress in the benchmark"
        default: "20"
  push:
    branches: [main]
    paths: ["ops/smoke-request.txt", ".github/workflows/smoke.yml"]

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  hf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: Hugging Face repos, bucket and round trip
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN secret is missing"; exit 1; fi
          ticdata smoke-hf --out reports/gha-hf.json
      - if: always()
        run: |
          echo '### Hugging Face' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat reports/gha-hf.json >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
          ticdata put-report reports/*.json --prefix "runs/$(date -u +%F)-gha-${GITHUB_RUN_ID}" || true

  net:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: Reach payers, probe ranges, measure download speed
        run: ticdata smoke-net --mb 512 --out reports/gha-net.json
      - name: Download + rapidgzip benchmark (experiment E2)
        run: ticdata bench --uhc-gb "${{ github.event.inputs.uhc_gb || '20' }}" --out reports/gha-bench.json
      - if: always()
        run: |
          for f in reports/*.json; do echo "### $f" >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; done
          ticdata put-report reports/*.json --prefix "runs/$(date -u +%F)-gha-${GITHUB_RUN_ID}" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: net-reports, path: reports/ }
