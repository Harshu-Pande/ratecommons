name: map
# Map stage: parse every in-network file of one payer into per-file tables in the work bucket
# (map/<release>/<payer>/<file key>/). Trigger: edit ops/map-request.txt on main; its last
# non-comment line is "<payer> <shards> [limit] [a-b]", for example "cigna 40" or "aetna 252 0 0-59"
# (limit 0 = all files; a-b runs only those shards of the plan; an optional 5th word
# "match=A,B" plans only files whose names contain A or B; a 6th word "base=N" numbers the shards from N,
# for files added to a payer after its map, e.g. "bcbs 4 0 20-23 match=2026-10-27_890_ base=20"; a 7th word
# "release=YYYY-MM" files them under that release instead of the date in their names).
on:
  workflow_dispatch:
    inputs:
      payer: { description: "cigna | aetna | uhc", required: true, default: "cigna" }
      shards: { description: "number of shards (<= 256)", required: true, default: "40" }
      limit: { description: "only the first N files (testing)", required: false, default: "" }
      range: { description: "only shards a-b of the plan", required: false, default: "" }
  push:
    branches: [main]
    paths: ["ops/map-request.txt"]

permissions:
  contents: read
  id-token: write   # Hugging Face Trusted Publishers (work bucket, ops dataset)

run-name: "map ${{ github.event.inputs.payer && format('{0} {1}', github.event.inputs.payer, github.event.inputs.range) || github.event.head_commit.message }}"

concurrency:
  # one lane per payer for dispatched runs (the orchestrator's UHC waves), one lane for pushed requests;
  # a new run in a lane replaces the running one
  group: map-${{ github.event.inputs.payer || 'push' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      payer: ${{ steps.plan.outputs.payer }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - id: plan
        run: |
          read payer shards limit range words <<< "$(grep -v '^#' ops/map-request.txt | grep -v '^[[:space:]]*$' | tail -1)"
          # optional key=value words: match=, base=, release=, perfile=<MB per file when balancing>, plan=<a stored
          # plan.json in the ops dataset to reuse as is (retrying shards of an earlier match= plan)>
          match=""; base=""; release=""; perfile=""; stored=""
          for w in $words; do case "$w" in match=*) match="$w";; base=*) base="$w";; release=*) release="$w";;
            perfile=*) perfile="${w#perfile=}";; plan=*) stored="${w#plan=}";; esac; done
          [ "$limit" = "0" ] && limit=""
          [ -n "${{ github.event.inputs.payer }}" ] && payer="${{ github.event.inputs.payer }}" && shards="${{ github.event.inputs.shards }}" && limit="${{ github.event.inputs.limit }}"
          [ -n "${{ github.event.inputs.payer }}" ] && range="${{ github.event.inputs.range }}" && match="" && base="" && release="" && stored="" && perfile=""
          echo "payer=$payer shards=$shards limit=$limit"
          # UHC: parse one file per identical-content group (gzip trailer fingerprints from uhc-tails)
          [ "$payer" = uhc ] && export TIC_DUP_TAILS="runs/2026-10-27-gha-run-40546293263/uhc-tails.json"
          if [ -n "$stored" ]; then
            STORED="$stored" python -c "import os, shutil; from huggingface_hub import hf_hub_download; shutil.copy(hf_hub_download('ratecommons/ops', os.environ['STORED'], repo_type='dataset'), 'plan.json')"
          else
            ticdata plan --payer "$payer" --shards "$shards" ${limit:+--limit $limit} --match "${match#match=}" --first-shard "$(b=${base#base=}; echo ${b:-0})" --release "${release#release=}" --file-mb "${perfile:-0}" --out plan.json > /dev/null
          fi
          # optional 4th word "a-b": run only shards a..b of the plan (waves that fit storage)
          # range: "a-b", or a comma list of shards and ranges ("0,1,8,12-15") to retry failed shards
          RANGE="$range" python -c "import json, os; d=json.load(open('plan.json')); r=os.environ['RANGE'] or '0-1000000'; want=set(); [want.update(range(int(x.split('-')[0]), int(x.split('-')[-1]) + 1)) for x in r.split(',') if x]; print(json.dumps([s['shard'] for s in d['shards'] if s['files'] and s['shard'] in want]))" > shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"
          echo "payer=$payer" >> "$GITHUB_OUTPUT"
          python -c "import json; d=json.load(open('plan.json')); print(d['files'], 'files', round(d['bytes']/1e9,1), 'GB')" >> "$GITHUB_STEP_SUMMARY"
          ticdata put-report plan.json --prefix "runs/$(date -u +%F)-map-$payer-${GITHUB_RUN_ID}" || true
      - uses: actions/upload-artifact@v5
        with: { name: plan, path: plan.json }
      - name: build the Rust core once for all shards
        run: cd core && cargo build --release && cp target/release/ticcore ../ticcore
      - uses: actions/upload-artifact@v5
        with: { name: ticcore, path: ticcore }

  parse:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12   # design: keep GitHub Actions concurrency well below the 20-job cap
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - uses: actions/download-artifact@v5
        with: { name: plan }
      - uses: actions/download-artifact@v5
        with: { name: ticcore }
      - run: chmod +x ticcore && echo "TIC_CORE=$PWD/ticcore" >> "$GITHUB_ENV"
      - name: free disk for large files
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: parse shard ${{ matrix.shard }}
        run: |
          mkdir -p reports
          ticdata parse-shard plan.json --shard ${{ matrix.shard }} --upload --out reports/shard-${{ matrix.shard }}.json
      - if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, glob
          for f in glob.glob("reports/*.json"):
              d = json.load(open(f))
              for r in d["results"]:
                  print(f"- {'ok' if r['ok'] else 'FAILED'} {r.get('parser')} {r['name']} {r.get('wall_seconds')}s rss {r.get('max_rss_mb')} MB {r.get('error','')[:200]}")
          PY
          ticdata put-report reports/* --prefix "runs/$(date -u +%F)-map-${{ needs.plan.outputs.payer }}-${GITHUB_RUN_ID}" || true

  next:
    # start the next wave's map (PIPELINE payers) or reduce when this run's shards are in
    needs: parse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - run: python ops/orchestrate.py
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_RUN_ID: ${{ github.run_id }}
          SELF_KIND: map
