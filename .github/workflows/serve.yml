name: serve
# Serving packs for the app and MCP tools (src/ticdata/serving.py). Trigger: edit ops/serve-request.txt
# on main; its last non-comment line lists targets, for example "shared cigna:dataset aetna:wave-1".
# "shared" rebuilds identity/serving (NPPES lite, Medicare PFS) first; "<payer>:<source>" builds
# <payer>/serving from the published release ("dataset") or a reduce wave ("wave-N"); an optional
# third part limits it to providers in some states, e.g. "aetna:wave-1:MO,IL,KS"; a fifth part picks the codes:
# "all", "common" (CareCompass procedures + CSTM-ALL, streamed from the release) or empty = auto (all for cigna,
# common for the big payers; see serve_jobs.FULL_PACK), e.g. "bcbs:dataset:::common".
on:
  workflow_dispatch:
    inputs:
      request: { description: "targets, as in ops/serve-request.txt", required: true }
  push:
    branches: [main]
    paths: ["ops/serve-request.txt"]

permissions:
  contents: read
  id-token: write

run-name: "serve ${{ github.event.inputs.request || github.event.head_commit.message }}"

jobs:
  args:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.a.outputs.shared }}
      packs: ${{ steps.a.outputs.packs }}
    steps:
      - uses: actions/checkout@v5
      - id: a
        run: |
          line="${{ github.event.inputs.request }}"
          [ -n "$line" ] || line="$(grep -v '^#' ops/serve-request.txt | grep -v '^[[:space:]]*$' | tail -1)"
          echo "request: $line"
          shared=false; packs=""
          for t in $line; do
            if [ "$t" = shared ]; then shared=true; else packs="$packs,\"$t\""; fi
          done
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "packs=[${packs#,}]" >> "$GITHUB_OUTPUT"

  shared:
    needs: args
    if: needs.args.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - run: ticdata serve-shared

  pack:
    needs: [args, shared]
    if: always() && needs.args.outputs.packs != '[]' && needs.shared.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.args.outputs.packs) }}
    env:
      PYTHONUNBUFFERED: "1"
      RC_DUCK_MEMORY: "11GB"
      RC_DUCK_THREADS: "4"
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google \
            /usr/share/swift /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e . httpx  # httpx: packs reuse the app's network labels (cloud/api/_rc.py)
      - name: pack ${{ matrix.target }}
        run: |
          IFS=: read payer source states match codes <<< "${{ matrix.target }}"
          RC_PACK_CODES="$codes" ticdata serve-pack --payer "$payer" --source "$source" --states "$states" --match "$match"
      - if: always()
        run: df -h / | tail -1
