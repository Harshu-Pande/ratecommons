name: shop
# CareCompass data (src/ticdata/shop.py): cleaned per-procedure offer files by state and ZIP3, plus ZIP/plan lookups,
# uploaded to the public work bucket under shop/v1/ for the patient app (carecompass/).
# Trigger: edit ops/shop-request.txt; its last line is e.g. "all" (every state + meta), "meta", or "TN,MO IL"
# (space-separated groups; each group runs on one runner), optionally with "prefix=shop/v2".
on:
  workflow_dispatch:
    inputs:
      request: { description: "groups", required: true, default: "all" }
  push:
    branches: [main]
    paths: ["ops/shop-request.txt"]

permissions:
  contents: read
  id-token: write

run-name: "shop ${{ github.event.inputs.request || github.event.head_commit.message }}"

jobs:
  args:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.a.outputs.groups }}
      prefix: ${{ steps.a.outputs.prefix }}
      meta: ${{ steps.a.outputs.meta }}
    steps:
      - uses: actions/checkout@v5
      - id: a
        run: |
          line="${{ github.event.inputs.request }}"
          [ -n "$line" ] || line="$(grep -v '^#' ops/shop-request.txt | grep -v '^[[:space:]]*$' | tail -1)"
          g=""; prefix="shop/v1"; meta=false
          for x in $line; do
            case "$x" in
              prefix=*) prefix="${x#prefix=}";;
              meta) meta=true;;
              all) meta=true
                   # big states alone, the rest in balanced groups (one runner each)
                   for y in CA TX FL NY PA IL OH GA NC MI NJ,CT VA,MD WA,OR MA,RI,NH,VT,ME AZ,NM,NV,UT TN,KY,WV IN,WI MO,KS,NE,IA \
                            MN,ND,SD,MT,WY,ID CO,OK,AR LA,MS,AL SC,DE,DC AK,HI; do g="$g,\"$y\""; done;;
              *) g="$g,\"$x\"";;
            esac
          done
          echo "groups=[${g#,}]" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "meta=$meta" >> "$GITHUB_OUTPUT"

  build:
    needs: args
    if: needs.args.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        states: ${{ fromJson(needs.args.outputs.groups) }}
    env:
      PYTHONUNBUFFERED: "1"
      RC_DUCK_MEMORY: "12GB"
      RC_DUCK_THREADS: "4"
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: build ${{ matrix.states }}
        run: ticdata shop-build --states "${{ matrix.states }}" --prefix "${{ needs.args.outputs.prefix }}"
      - if: always()
        run: df -h / | tail -1

  meta:
    needs: args
    if: needs.args.outputs.meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      RC_DUCK_MEMORY: "8GB"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - run: ticdata shop-meta --prefix "${{ needs.args.outputs.prefix }}"
